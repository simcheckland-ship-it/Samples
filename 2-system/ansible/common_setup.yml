---
- name: "🌐 Baseline OS Hardening"
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Wait for VMs to become fully reachable via SSH
      ansible.builtin.wait_for_connection:
        timeout: 90
        delay: 5

    - name: Gather facts after connection confirmation
      ansible.builtin.setup:

    - name: Ensure clean baseline state
      become: true
      block:
        - name: Wait for Cloud-Init first-boot processes to finish on hypervisor
          ansible.builtin.command: cloud-init status --wait
          changed_when: false
          failed_when: false

        - name: Force functional upstream DNS nameservers
          ansible.builtin.copy:
            dest: /etc/resolv.conf
            content: |
              nameserver 8.8.8.8
              nameserver 1.1.1.1

        - name: Remove broken legacy Docker repositories
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list.d/docker.list
            - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list

        - name: Force break stuck apt/dpkg locks and clear dead metadata
          ansible.builtin.shell: |
            killall apt apt-get dpkg unattended-upgrades 2>/dev/null || true
            rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock
            rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            dpkg --configure -a
            apt-get clean
          failed_when: false

        # 🟢 FIXED: Combined timeouts and forced IPv4-only to stop network hanging
        - name: Force short connection timeouts and IPv4-only for APT configuration
          ansible.builtin.copy:
            dest: /etc/apt/apt.conf.d/99timeout
            content: |
              Acquire::ForceIPv4 "true";
              Acquire::http::Timeout "10";
              Acquire::https::Timeout "10";
              Acquire::ftp::Timeout "10";
              Acquire::Retries "2";

    # 🟢 FIXED: Removed the standalone update task and handle it safely inside the installation
    - name: Install baseline system prerequisites
      apt:
        name:
          [
            apt-transport-https,
            ca-certificates,
            curl,
            gnupg,
            software-properties-common,
          ]
        state: present
        update_cache: yes  # Runs the update over IPv4 only with explicit 10s timeouts
        dpkg_options: 'force-confold,force-confdef'
      become: true
      register: apt_result
      until: apt_result is success
      retries: 5
      delay: 10
      environment:
        DEBIAN_FRONTEND: noninteractive
        DEBCONF_NONINTERACTIVE_SEEN: "true"
        NEEDRESTART_MODE: "a"

    # 🟢 Install docker adnd docker compose
    - name: Purge ALL previous conflicting Docker source files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/docker.sources
        - /etc/apt/keyrings/docker.asc
        - /etc/apt/trusted.gpg.d/docker.gpg
        
    - name: Create directory for Docker APT key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'  

    - name: Add Docker repository to APT sources
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes
    
    - name: Assign deployment user to the docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Ensure the global base docker directory exists
      ansible.builtin.file:
        path: /opt/docker
        state: directory
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: "0755"
      become: true

    - name: Create Nginx SSL system directory
      ansible.builtin.file:
        path: /etc/nginx/ssl
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

