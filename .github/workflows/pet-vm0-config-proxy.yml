name: Deploy Nginx Reverse Proxy to First Downstream Proxy

on:
  push:
    branches:
      - main
    paths:
     - "proxy/**"
     - ".github/workflows/vm0-deploy-proxy.yml"

jobs:
  deploy:
    # Tells GitHub to execute this job on your local Linux runner
    runs-on: [self-hosted, linux]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Proxy Config Files to Downstream Proxy
        run: |
          # 1. Copies files into /opt/nginx-proxy/ over the private vmbr1 network
          # Uses your runner's internal access to hit the isolated downstream IP directly
          scp -i /root/.ssh/runner-to-vm0 -o StrictHostKeyChecking=no proxy/* sim@10.10.10.100:/opt/nginx-proxy/

      - name: Start Nginx Proxy Container on Downstream Proxy
        run: |
          # 2. Connects to the downstream proxy over the 10.10.10.* bridge, 
          #    rebuilds its local Docker stack, and applies your rules on port 80
          ssh -i /root/.ssh/runner-to-vm0 -o StrictHostKeyChecking=no sim@10.10.10.100 "
            cd /opt/nginx-proxy && 
            docker compose down && 
            docker compose up -d --force-recreate
          "
