# .github/workflows/deploy-proxy.yml
name: Deploy Proxy Container

on:
  workflow_call:
    inputs:
      target_host:
        required: true
        type: string
        description: "The specific VM hostname to target (e.g., VM200)"
      target_ip:
        required: true
        type: string
        description: "The API backend IP address for internal configuration"
      user:
        required: true
        type: string
        description: "The API backend user"
        
jobs:
  configure-docker:
    runs-on: self-hosted
    env:
      PROXY_PATH: /opt/docker/nginx-proxy
    steps:
      - name: Show Passed Values
        run: |
          echo "Target Host is: ${{ inputs.target_host }}"
          echo "API IP is: ${{ inputs.target_ip }}"
          echo "API User is: ${{ inputs.user }}"
          
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Create Folders For Config Files
        run: |
          ssh -i /root/.ssh/runner-vm  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${{ inputs.user }}@${{ inputs.target_ip }}" |
          "sudo mkdir  ${{ env.PROXY_PATH }} && sudo chown -R ${{ inputs.user }}:${{ inputs.user }} ${{ env.PROXY_PATH }} "
          
      - name: Copy Proxy Config Files to Downstream Proxy
        run: |
          # 1. Copies files into /opt/nginx-proxy/ over the private vmbr1 network
          # Uses your runner's internal access to hit the isolated downstream IP directly
          scp -i /root/.ssh/runner-vm  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null  3-software/proxy/* ${{ inputs.user }}@${{ inputs.target_ip }}:${{ env.PROXY_PATH }}/
        
      - name: Start Nginx Proxy Container on Downstream Proxy
        run: |
          # 2. Connects to the downstream proxy over the 10.10.10.* bridge, 
          #    rebuilds its local Docker stack, and applies your rules on port 80
          ssh -i /root/.ssh/runner-vm -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null  ${{ inputs.user }}@${{ inputs.target_ip }} "
            cd ${{ env.PROXY_PATH }} && 
            docker compose down && 
            docker compose up -d --force-recreate
          "
