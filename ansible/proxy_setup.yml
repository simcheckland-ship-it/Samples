---
- name: "🔒 Proxy Server Specific Configuration"
  hosts: VM200 # 🎯 ONLY targets your proxy VM node
  become: true

  tasks:
    - name: Create Nginx infrastructure directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "/etc/nginx/ssl", mode: "0700" }
        - { path: "/opt/nginx-proxy/", mode: "0755" }

    - name: Copy deployment files from root proxy folder
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../proxy/{{ item }}"
        dest: "/opt/nginx-proxy/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - docker-compose.yml
        - nginx.conf
      become: true

    - name: Install NFS client utilities
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true
      become: true

    - name: Create local directory for certificates
      ansible.builtin.file:
        path: /mnt/certs
        state: directory
        mode: "0755"
      become: true

    - name: Mount the NFS directory containing the certificates
      ansible.posix.mount:
        src: "192.168.0.208:/mnt/pve/central-certs" # 👈 Replace 192.168.0.X with your actual NFS Server IP
        path: /mnt/certs
        fstype: nfs
        opts: rw,sync,hard,intr
        state: mounted
      become: true
