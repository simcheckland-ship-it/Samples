server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # ⚠️ CRITICAL STEP FOR SPA ROUTING (React Router / Vite)
        # Tells Nginx to redirect all requests back to index.html 
        # so React can handle the page routing internally.
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets heavily for fast loading
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Handle internal server errors gracefully
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
