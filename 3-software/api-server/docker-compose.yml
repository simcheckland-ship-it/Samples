services:
  photo-nginx:
    image: nginx:latest
    container_name: nginx-api
    ports:
      - "80:80"
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapi # Ensures the API starts before Nginx attempts to route to it

  webapi:
    container_name: photo-webapi
    build: 
      context: .                        # Look inside the current api/ folder
      dockerfile: Dockerfile 
    ports:
      - "5000:8080" # Maps Proxmox port 5000 to internal .NET 8 container port 8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - MongoDB__ApiKey=${MONGODB_KEY}
    restart: always


