events { 
    worker_connections 1024; 
}


http {



     # Define the custom reverse proxy logging format
    log_format proxy_logging '[$time_local] Client: $remote_addr '
                     'RealIP: $http_x_real_ip '
                     'Request: "$request" Status: $status '
                     'Upstream: $upstream_addr '
                     'Upstream_Status: $upstream_status '
                     'Request_Time: $request_time '
                     'Upstream_Response_Time: $upstream_response_time';
     # Define a custom log format that highlights the Referer
    log_format image_security '$remote_addr - [$time_local] "$request" '
                              'Status: $status | Referer: "$http_referer"';
     # IIS W3C Extended Log Format replica
    log_format iis_style '$time_iso8601 $server_addr $request_method $uri '
                     '$args $server_port - $remote_addr $http_user_agent '
                     '$http_referer $status $body_bytes_sent';

    # OPTION A: Route all access logs to standard output (stdout) using the custom format
    #access_log /dev/stdout iis_style;

     # PLACE THIS MAP BLOCK HERE:
    map $http_origin $cors_origin {
        default "";
        "https://www.sw-jar.co.uk" "https://www.sw-jar.co.uk";
        "http://localhost:5173"    "http://localhost:5173";
    }


     # Define the backend address for your React server
    geo $http_x_target_set_ip $target_react_server {
        default          react_photoglobe_fallback;
        10.10.10.100/32  react_server_100;    # If proxy is .100 -> target is .101
        10.10.10.200/32  react_server_200;    # If proxy is .200 -> target is .201
        10.10.10.210/32  react_server_210;    # If proxy is .210 -> target is .211
    }  
    upstream react_server_100 {
        server 10.10.10.100:3000;
    }
     upstream react_server_200 {
        server 10.10.10.200:3000;
    }
     upstream react_server_210 {
        server 10.10.10.210:3000;
    }
     upstream react_server_fallback {
        server 10.10.10.100:3000;
    }
    
    # Define the backend address for your API server
    geo $http_x_target_set_ip $target_core_api {
        default          core_api_fallback;
        10.10.10.100/32  core_api_101;    # If proxy is .100 -> target is .101
        10.10.10.200/32  core_api_201;    # If proxy is .200 -> target is .201
        10.10.10.210/32  core_api_211;    # If proxy is .210 -> target is .211
    }  
    upstream core_api_101 {
        server 10.10.10.101:80;
    }
    upstream core_api_201 {
        server 10.10.10.201:80;
    }
    upstream core_api_211 {
        server 10.10.10.211:80;
    }
    upstream core_api_fallback {
        server 10.10.10.101:80;
    }

    

    upstream react_app_iphone {
        server 192.168.0.200:3001;
    }
    
    upstream image_server {
        server 192.168.0.202:3500;
    }

    #server {
    #    listen 80;
    #    server_name 10.10.10.100;
    #     return 200 "Hello World\n";
    #}
    
    # Optional: Redirect HTTP (port 80) to HTTPS
    #server {
    #    listen 80;
    #    server_name 192.168.0.200;
    #    return 301 https://$server_name$request_uri;
    #}

    server {
        #listen 443 ssl;
        listen 80;
        
        # Replace this with vm0's actual IP address or local domain name
        server_name _; 

        # GLOBAL SAFETY BARRIER: Applies to the entire site by default
        client_max_body_size 1M; 

        # Use /etc/nginx/certs/ inside docker container 
        # ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        # ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

         # Bbasic encryption protocols
        #ssl_protocols TLSv1.2 TLSv1.3;
        #ssl_ciphers HIGH:!aNULL:!MD5;

        # Block common router exploit paths and return 403 Forbidden
        # Catch .env, .aws, cgi-bin, config files, backups, and PHP info paths
        location ~* /(\.env|\.aws|cgi-bin|conf\.bin|phpinfo|info|_profiler|config\.(json|yaml|yml|xml|ini|js))|\.(env|bak|backup|save) {
            deny all;
        }


        

         # Routes standard traffic to your React frontend container
        location / {
            default_type text/html;
            charset utf-8;
            return 200 '<!DOCTYPE html>
                <html>
                    <head>
                        <title>Sim Checkland</title>
                        <style>body { font-family: sans-serif; text-align: center; padding: 50px; }</style>
                    </head>
                    <body>
                        <h2>Sim Checkland</h2>
                        <h3>Design and deploy automated, containerised multi-tier web applications.</h3>
                        <p>Email: <a href="mailto:sim.checkland@outlook.com" style="color: blue; font-weight: bold;">sim.checkland@outlook.com</a></p>
                        <p>GitHub: <a href="https://github.com/simcheckland-ship-it/SamplePhotoApp/tree/main" style="color: blue; font-weight: bold;">SW-JAR Code Samples</a></p>
                    </body>
                </html>';
        }    

        location /photoglobe {
            proxy_pass http://$target_react_server;
            
            # Pass essential headers so the React app understands network context
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }  
        
        location /hello/ {
            return 200 "Hello, App: ${target_react_server} Api: ${target_core_api} Server: %{$server_addr} TargetSet: $http_x_target_set_ip}\n";
        }

         # Routes iphone traffic to your React iphone container
        location /iphone/ {
            proxy_pass http://$target_react_server;
            
            # Pass essential headers so the React app understands network context
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }  
        
        # Routes standard API requests (like /api/Photos/...) directly to your API container
        location /api/ {
            # Overrides the global limit ONLY for URLs starting with /api/
            client_max_body_size 50M;
            
            proxy_pass http://$target_core_api;
            
            # Pass essential headers so the .NET runtime understands network context
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 1. Force Nginx to match the absolute URL directory path cleanly
        # The ^~ modifier forces Nginx to immediately execute proxy_pass and ignore local directory searches
        location /uploads/ {
            
            #valid_referers none blocked 192.168.0.200 172.18.0.2 $server_addr localhost ~localhost:;
            #if ($invalid_referer) {
            #   return 404;
            #}
            
            proxy_pass http://image_server; 

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-API-Key' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            proxy_set_header X-API-Key "PreventHotLinking";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto "http";
        }



        # Catch-all block for errors or missing routes
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}

